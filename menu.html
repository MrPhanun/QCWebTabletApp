<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QC Dept App</title>
<link rel="icon" href="/favicon.ico?v=2" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #052e22;
    --ink-soft: #3f6b5b;
    --muted: #7fa393;
    --accent-1: #059669;
    --accent-2: #34d399;
    --line: rgba(5,150,105,.14);
    --glass: rgba(255,255,255,.62);
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    height: 100vh; overflow: hidden;
    font-family: "Plus Jakarta Sans", "Noto Sans Khmer", system-ui, sans-serif; color: var(--ink);
    background:
      radial-gradient(60vmax 60vmax at 0% 0%, #d1fae5 0%, transparent 60%),
      radial-gradient(60vmax 60vmax at 100% 100%, #bbf7d0 0%, transparent 60%),
      #f7fffb;
    display: grid; grid-template-rows: 64px 1fr;
  }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: var(--glass); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    position: relative; z-index: 3;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.3px; }
  .brand img { width: 32px; height: 32px; border-radius: 9px; }
  .topbar .menu-toggle { padding: 0 9px; }
  .spacer { flex: 1; }
  .user { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .user .avatar {
    width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; font-weight: 800;
  }
  .user .name { font-weight: 700; line-height: 1.2; }
  .user .role { font-size: 12px; color: var(--ink-soft); }
  .icon-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.7);
    color: var(--ink); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s, border-color .2s;
  }
  .icon-btn:hover { background: #fff; border-color: var(--accent-1); }
  /* Button icon chip */
  .bi {
    display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; margin-left: -4px; border-radius: 8px;
    background: rgba(5,150,105,.12); color: var(--accent-1); transform: rotate(-6deg); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  .bi svg.i { width: 14px; height: 14px; stroke-width: 2.2; }
  button:hover:not(:disabled) .bi { transform: rotate(8deg) scale(1.12); }
  button:active:not(:disabled) .bi { transform: rotate(0) scale(.92); }
  .btn-primary .bi, .icon-btn.next .bi, .dlg-btn.go .bi { background: rgba(255,255,255,.24); color: #fff; }
  .icon-btn.del .bi, .dlg.danger .dlg-btn.go .bi { background: rgba(220,38,38,.12); color: #dc2626; }
  .dlg.danger .dlg-btn.go .bi { background: rgba(255,255,255,.24); color: #fff; }
  .icon-btn.del:hover { border-color: #dc2626; color: #b91c1c; }
  .row-actions .bi { width: 19px; height: 19px; border-radius: 7px; }
  .row-actions .bi svg.i { width: 12px; height: 12px; }
  .dlg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  @media (prefers-reduced-motion: reduce) { .bi { transition: none; } }
  .env-badge { display: none; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #92400e; background: #fef3c7; }

  /* Layout */
  .layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: minmax(0, 1fr); min-height: 0; transition: grid-template-columns .25s ease; }
  /* Desktop: the ☰ button hides the menu so the screen gets the full width */
  @media (min-width: 861px) {
    body.nav-hidden .layout { grid-template-columns: 0 1fr; }
    .sidebar { overflow: hidden; }
    body.nav-hidden .sidebar { visibility: hidden; border-right: 0; }
    body.nav-hidden .menu-toggle { background: linear-gradient(110deg, var(--accent-1), var(--accent-2)); border-color: transparent; color: #fff; }
  }

  /* Sidebar + tree */
  .sidebar {
    display: flex; flex-direction: column; min-height: 0;
    background: rgba(255,255,255,.45); border-right: 1px solid var(--line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .tree-tools { padding: 14px 14px 8px; display: grid; gap: 8px; }
  .search {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
    border-radius: 12px; background: rgba(255,255,255,.8); border: 1.5px solid rgba(255,255,255,.9);
    color: var(--accent-1); transition: border-color .2s, box-shadow .2s;
  }
  .search:focus-within { border-color: var(--accent-1); box-shadow: 0 0 0 4px rgba(5,150,105,.15); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink); }
  .search input::placeholder { color: var(--muted); }
  .tree-actions { display: flex; gap: 6px; }
  .tree-actions button { flex: 1; height: 30px; font-size: 12px; justify-content: center; }

  .tree { list-style: none; overflow-y: auto; padding: 4px 10px 16px; flex: 1; }
  .tree ul { list-style: none; position: relative; margin-left: 17px; padding-left: 8px; }
  .tree ul::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 8px; border-left: 1.5px dashed rgba(5,150,105,.25); }
  .tree li[aria-expanded="false"] > ul { display: none; }

  .node {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 6px 8px;
    border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left;
    font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink); transition: background .15s, color .15s;
  }
  .node:hover { background: rgba(5,150,105,.08); }
  .node:focus-visible { outline: 2px solid var(--accent-1); outline-offset: -2px; }
  .node .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s; }
  .node .chev.blank { visibility: hidden; }
  li[aria-expanded="true"] > .node .chev { transform: rotate(90deg); }
  .node .ic { color: var(--accent-1); }
  .node .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .count { font-size: 11px; font-weight: 700; color: var(--ink-soft); background: rgba(5,150,105,.1); padding: 1px 7px; border-radius: 999px; }
  .tree > li > .node { font-weight: 700; }
  li[aria-selected="true"] > .node { background: linear-gradient(110deg, var(--accent-1), var(--accent-2)); color: #fff; box-shadow: 0 6px 14px -6px rgba(5,150,105,.6); }
  li[aria-selected="true"] > .node .ic, li[aria-selected="true"] > .node .chev { color: #fff; }
  .node mark { background: #fde68a; color: inherit; border-radius: 3px; }
  .tree-empty { display: none; padding: 16px; font-size: 13px; color: var(--muted); text-align: center; }

  /* Content */
  .content { overflow-y: auto; padding: 28px 32px; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .crumbs .sep { color: var(--muted); }
  .content h1 { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 800; letter-spacing: -.6px; margin-bottom: 20px; }
  .content h1 .ic-wrap { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; }
  .content h1 svg.i { width: 22px; height: 22px; }
  .panel {
    padding: 24px; border-radius: 24px; background: var(--glass); border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 20px 50px -24px rgba(5,150,105,.35);
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .tile {
    display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; cursor: pointer;
    background: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.9); text-align: left;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent-1); box-shadow: 0 12px 24px -12px rgba(5,150,105,.5); }
  .tile .ic-wrap { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: #d1fae5; color: var(--accent-1); flex: none; }
  .placeholder { text-align: center; padding: 48px 16px; color: var(--ink-soft); }
  .placeholder svg.i { width: 44px; height: 44px; color: var(--accent-2); margin-bottom: 12px; }
  .placeholder b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 6px; }

  /* Master-data form + table (Sampling Plan) */
  .form-grid { display: grid; grid-template-columns: 180px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
  .fld { display: grid; gap: 6px; min-width: 0; font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .5px; }
  .fld input {
    width: 100%; min-width: 0; height: 44px; padding: 0 14px; border-radius: 14px; border: 1.5px solid rgba(5,150,105,.2); background: rgba(255,255,255,.85);
    font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); outline: 0; transition: border-color .2s, box-shadow .2s;
  }
  .fld select {
    width: 100%; min-width: 0; height: 44px; padding: 0 10px; border-radius: 14px; border: 1.5px solid rgba(5,150,105,.2); background: rgba(255,255,255,.85);
    font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); outline: 0; cursor: pointer; transition: border-color .2s, box-shadow .2s;
  }
  .fld input:focus, .fld select:focus { border-color: var(--accent-1); box-shadow: 0 0 0 4px rgba(5,150,105,.15); }
  .fld input:disabled { background: rgba(5,150,105,.06); color: var(--ink-soft); cursor: not-allowed; }
  .fld input.bad { border-color: #dc2626; box-shadow: 0 0 0 4px rgba(220,38,38,.12); }
  .users-form { grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1fr) 120px 140px auto; margin-bottom: 16px; }
  .fld input::placeholder { color: var(--muted); font-weight: 500; }
  .seg { display: flex; height: 44px; padding: 4px; border-radius: 14px; background: rgba(5,150,105,.08); }
  .seg button {
    flex: 1; border: 0; border-radius: 10px; background: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink-soft); transition: background .2s, color .2s;
  }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(5,46,34,.12); }
  .seg button[data-level="Hard"][aria-pressed="true"] { color: #b45309; }
  .form-actions { display: flex; gap: 8px; }
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; padding: 0 20px; border: 0; border-radius: 14px; cursor: pointer; white-space: nowrap;
    background: linear-gradient(110deg, var(--accent-1), var(--accent-2)); color: #fff;
    font-family: inherit; font-size: 14px; font-weight: 700; box-shadow: 0 10px 20px -10px rgba(5,150,105,.7);
  }
  .btn-primary:disabled { opacity: .6; cursor: progress; }
  .form-actions .icon-btn { height: 44px; border-radius: 14px; }
  /* Status messages: soft pills with an icon badge (red = problem, green = done); hidden when empty */
  .msg {
    display: flex; align-items: flex-start; gap: 9px; width: fit-content; max-width: 100%; margin: 12px 0 0;
    padding: 9px 16px 9px 10px; border-radius: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.45;
    overflow-wrap: anywhere; animation: msg-in .3s cubic-bezier(.34,1.56,.64,1);
  }
  .msg:empty { display: none; }
  .msg::before {
    flex: none; width: 21px; height: 21px; margin-top: -1px; border-radius: 8px; display: grid; place-items: center;
    font-size: 12px; font-weight: 800; color: #fff;
  }
  .msg.err { color: #9f1239; background: linear-gradient(110deg, #fff1f2, #ffe4e6); border: 1px solid #fecdd3; box-shadow: 0 10px 20px -14px rgba(225,29,72,.7); }
  .msg.err::before { content: "!"; background: linear-gradient(135deg, #e11d48, #fb7185); transform: rotate(-6deg); }
  .msg.ok { color: #065f46; background: linear-gradient(110deg, #ecfdf5, #d1fae5); border: 1px solid #a7f3d0; box-shadow: 0 10px 20px -14px rgba(5,150,105,.7); }
  .msg.ok::before { content: "✓"; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); transform: rotate(-6deg); }
  @keyframes msg-in { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }

  .lvl-head { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; font-size: 16px; font-weight: 800; }
  .lvl-pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .4px; }
  .lvl-pill.Normal { background: #d1fae5; color: #065f46; }
  .lvl-pill.Hard { background: #fef3c7; color: #92400e; }
  .table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.75); }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th { text-align: left; padding: 11px 14px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); background: rgba(5,150,105,.06); white-space: nowrap; }
  table.data td { padding: 10px 14px; border-top: 1px solid var(--line); white-space: nowrap; }
  table.data td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
  table.data td.meta { font-size: 12px; color: var(--ink-soft); }
  table.data tr.editing td { background: rgba(52,211,153,.14); }
  table.data tr.gap td { padding: 6px 14px; font-size: 12px; font-weight: 600; color: #b45309; background: rgba(254,243,199,.45); }
  table.data .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  table.data .row-actions .icon-btn { height: 30px; padding: 0 10px; font-size: 12px; }
  table.data .row-actions .del:hover { border-color: #dc2626; color: #b91c1c; }
  .empty-row { padding: 18px 14px; text-align: center; color: var(--muted); font-size: 13px; }
  .readonly-note {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px;
    font-size: 14px; font-weight: 600; color: #92400e; background: rgba(254,243,199,.7); border: 1px solid rgba(245,158,11,.3);
  }
  @media (max-width: 860px) {
    .form-grid, .users-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .panel { padding: 16px; border-radius: 20px; }
    .form-grid .fld-level, .form-actions { grid-column: 1 / -1; }
    .form-actions .btn-primary { flex: 1; }
  }

  /* OQC Data Information: on-screen copy of the paper OQC Inspection record (QC-RE-002) */
  .oqc-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .oqc-toolbar .msg { margin: 0 0 0 4px; }
  .oqc-scan { width: min(100%, 320px); border-color: rgba(5,150,105,.25); }
  .oqc-pager { display: flex; align-items: center; gap: 6px; padding: 3px; border-radius: 14px; background: rgba(5,150,105,.08); }
  .oqc-pager .icon-btn { height: 32px; border-radius: 10px; }
  .oqc-pager .icon-btn:disabled { opacity: .4; cursor: default; }
  .oqc-pager .next { background: linear-gradient(110deg, var(--accent-1), var(--accent-2)); border-color: transparent; color: #fff; font-weight: 700; }
  .oqc-pager .next:hover { filter: brightness(1.05); }
  .oqc-pager .del:hover { border-color: #dc2626; color: #b91c1c; }
  .oqc-pageno { min-width: 76px; text-align: center; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  svg.i.flip { transform: rotate(180deg); }
  .oqc-sheet-page { font-weight: 800 !important; color: var(--ink) !important; }
  #oqcPrintPages { display: none; }
  .oqc-save { height: 36px; padding: 0 18px; border-radius: 12px; }
  .oqc-save:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .oqc-rec { padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .oqc-rec[data-state="new"] { background: rgba(5,150,105,.08); color: var(--ink-soft); }
  .oqc-rec[data-state="saved"] { background: #d1fae5; color: #065f46; }
  .oqc-rec[data-state="unsaved"], .oqc-rec[data-state="changed"] { background: #fef3c7; color: #92400e; }
  .oqc-rec[data-state="unsaved"]::before, .oqc-rec[data-state="changed"]::before { content: "● "; }
  .oqc-find { margin-bottom: 14px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.7); border: 1px solid var(--line); animation: msg-in .25s ease; }
  .oqc-find-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .oqc-find-bar .search { flex: 1; min-width: 220px; max-width: 460px; border-color: rgba(5,150,105,.25); }
  .oqc-find-bar .count { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .oqc-find-bar #oqcFindClose { margin-left: auto; }
  .oqc-find .table-wrap { max-height: 340px; overflow: auto; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; }
  .pill.done { background: #d1fae5; color: #065f46; }
  .pill.draft { background: #fef3c7; color: #92400e; }
  .pill.ok { background: #d1fae5; color: #065f46; }
  .pill.ng { background: #fee2e2; color: #b91c1c; }
  /* Roles & Permissions grid */
  .perm-hint { margin: 0 0 6px; font-size: 13px; color: var(--ink-soft); }
  .perm-wrap { max-height: calc(100vh - 330px); overflow: auto; }
  table.perm-grid { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
  table.perm-grid th, table.perm-grid td { padding: 6px 8px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.92); white-space: nowrap; }
  table.perm-grid thead th { position: sticky; top: 0; z-index: 2; background: #f0fbf6; font-size: 12px; font-weight: 800; color: var(--ink-soft); text-align: center; }
  table.perm-grid thead tr:nth-child(2) th { top: 33px; }
  table.perm-grid th.grp { border-left: 2px solid rgba(5,150,105,.25); color: var(--ink); }
  table.perm-grid th.act button { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 2px 6px; border-radius: 8px; }
  table.perm-grid th.act button:hover:not(:disabled) { background: rgba(5,150,105,.12); color: var(--ink); }
  table.perm-grid .sticky { position: sticky; left: 0; z-index: 1; text-align: left; box-shadow: 1px 0 0 var(--line); }
  table.perm-grid thead .sticky { z-index: 3; }
  table.perm-grid td.cb { text-align: center; }
  table.perm-grid td.view { border-left: 2px solid rgba(5,150,105,.25); }
  table.perm-grid td.changed { background: #fef3c7; }
  table.perm-grid tr.me td.sticky { background: #ecfdf5; }
  .pm-user { display: flex; align-items: center; gap: 10px; min-width: 230px; }
  .pm-who { display: grid; line-height: 1.25; flex: 1; }
  .pm-who small { font-size: 11px; color: var(--ink-soft); }
  .pill.default { background: rgba(5,150,105,.08); color: var(--ink-soft); }
  .pill.custom { background: #ede9fe; color: #5b21b6; }
  .tick { display: inline-grid; cursor: pointer; }
  .tick input { position: absolute; opacity: 0; width: 0; height: 0; }
  .tick span { width: 22px; height: 22px; border-radius: 8px; border: 2px solid rgba(5,150,105,.3); background: #fff; display: grid; place-items: center;
    transition: background .15s, border-color .15s, transform .15s; }
  .tick input:checked + span { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border-color: transparent; transform: rotate(-6deg); }
  .tick input:checked + span::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 900; }
  .tick input:focus-visible + span { box-shadow: 0 0 0 3px rgba(5,150,105,.3); }
  .tick input:disabled + span { opacity: .55; cursor: default; }
  .perm-save { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; padding: 10px 12px;
    border-radius: 16px; background: #fffbeb; border: 1px solid #fde68a; font-weight: 700; color: #92400e; animation: msg-in .25s ease; }
  .perm-save span { margin-right: auto; }
  .pill.admin { background: linear-gradient(110deg, var(--accent-1), var(--accent-2)); color: #fff; }
  .pill.user { background: rgba(5,150,105,.1); color: var(--ink-soft); }
  .pill.dept { background: #e0f2fe; color: #075985; }
  .u-name { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
  .u-av { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; flex: none;

  .oqc-sheet .missing { border-color: #f43f5e !important; background: #fff1f2 !important; box-shadow: 0 0 0 3px rgba(244,63,94,.18) !important; }
  .oqc-prob.missing { box-shadow: 0 0 0 2px #f43f5e, 0 0 0 5px rgba(244,63,94,.18); }
  /* SPEC master: list + editor laid out like the OQC record */
  .spec-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 12px; }
  .spec-bar .search { width: min(100%, 360px); border-color: rgba(5,150,105,.25); }
  .spec-bar .count { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .spec-editor { margin-bottom: 16px; }
  .spec-editor h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
  .spec-editor h3 small { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .spec-edit-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .spec-editor td.na { background: repeating-linear-gradient(135deg, #f6f8f7 0 6px, #eef2f0 6px 12px); }
  .spec-editor td.pos { width: 30%; }
  .spec-editor td.pos input { text-align: center; font-weight: 800; }
  .spec-editor input.big { font-size: 15px; font-weight: 800; text-align: center; }
  .spec-editor input:disabled, .spec-editor textarea:disabled { background: none; color: var(--ink); }
  table.data td.txt { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  table.data tr.copying td { background: rgba(254,243,199,.6); }

  .oqc-prob { height: 34px; padding: 3px; border-radius: 10px; min-width: 150px; }
  .oqc-prob button { border-radius: 7px; font-size: 13px; }
  .oqc-prob button[data-prob="Normal"][aria-pressed="true"] { background: var(--accent-1); color: #fff; }
  .oqc-prob button[data-prob="Strict"][aria-pressed="true"] { background: #d97706; color: #fff; }
  .oqc-sheet { background: #fff; border: 1.5px solid #8fb3a4; border-radius: 16px; padding: 14px; display: grid; gap: 12px; font-size: 13px; }
  .oqc-sheet .km { display: block; font-family: "Noto Sans Khmer", "Plus Jakarta Sans", sans-serif; font-weight: 600; line-height: 1.5; }
  .oqc-sheet .en { display: block; font-size: 11px; font-weight: 600; color: var(--ink-soft); letter-spacing: .2px; }
  .oqc-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
  .oqc-co b { display: block; font-size: 15px; font-style: italic; font-weight: 800; color: #1e3a8a; }
  .oqc-co span { font-family: "Noto Sans Khmer", sans-serif; font-weight: 700; color: #1e3a8a; }
  .oqc-title { text-align: center; }
  .oqc-title .km { font-size: 22px; font-weight: 700; }
  .oqc-title b { font-size: 17px; font-weight: 800; }
  .oqc-ref { justify-self: end; display: grid; gap: 6px; justify-items: end; text-align: right; }
  .oqc-ref small { font-size: 11px; font-weight: 600; color: var(--ink-soft); }
  .oqc-ref label { display: grid; gap: 2px; }
  .oqc-ref input { width: 160px; }
  table.oqc { width: 100%; border-collapse: collapse; }
  table.oqc th, table.oqc td { border: 1px solid #b5ccc2; padding: 5px 6px; vertical-align: middle; text-align: left; }
  table.oqc th { background: rgba(5,150,105,.06); font-weight: 600; }
  table.oqc th.c, table.oqc td.c { text-align: center; }
  table.oqc td.no { width: 34px; text-align: center; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  table.oqc td.rc { width: 84px; }
  table.oqc tr.sec td { background: rgba(5,150,105,.06); }
  .oqc-sheet input, .oqc-sheet textarea {
    width: 100%; min-width: 0; border: 1px solid transparent; border-radius: 6px; padding: 5px 7px;
    background: rgba(5,150,105,.05); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink); outline: 0; resize: vertical;
  }
  .oqc-sheet input:focus, .oqc-sheet textarea:focus { border-color: var(--accent-1); background: #fff; box-shadow: 0 0 0 3px rgba(5,150,105,.15); }
  .oqc-sheet textarea { margin-top: 4px; }
  .oqc-sheet input.ng { background: #fee2e2; color: #b91c1c; }
  .oqc-sheet select.res {
    width: 100%; min-width: 64px; height: 32px; border: 1.5px solid rgba(5,150,105,.25); border-radius: 8px; background: #fff;
    font-family: inherit; font-size: 13px; font-weight: 800; color: var(--ink); text-align: center; cursor: pointer;
  }
  .oqc-sheet select.res[data-v="OK"] { background: #d1fae5; border-color: #34d399; color: #065f46; }
  .oqc-sheet select.res[data-v="NG"] { background: #fee2e2; border-color: #f87171; color: #b91c1c; }
  .oqc-sheet select.res[data-v="/"] { background: #f1f5f9; border-color: #cbd5e1; color: #64748b; }
  .oqc-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .oqc-len-wrap { overflow-x: auto; }
  .oqc-len { min-width: 500px; }
  .oqc-len td { padding: 3px 4px; }
  .oqc-len td.smp { width: 58px; }
  /* ④⑤ not used: one diagonal line across the whole block (see slashUnused) */
  .oqc-len td.smp { position: relative; }
  .oqc-len svg.slash { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
  .oqc-len svg.slash line { stroke: #475569; stroke-width: 1.6; stroke-linecap: round; }
  .oqc-len.slashed td.smp:nth-child(n+7) input { background: transparent; }
  /* Row without SPEC: blank cells; the box shows again on hover/focus so it can still be typed in */
  .oqc-len tr.nospec input.spec, .oqc-len tr.nospec input.smp, .oqc-len tr.nospec.nopos input[data-pos] { background: transparent; }
  .oqc-len tr.nospec input:hover, .oqc-len tr.nospec input:focus { background: rgba(5,150,105,.05); }
  .oqc-len input { text-align: center; padding: 4px 3px; font-variant-numeric: tabular-nums; }
  .oqc-sec-title { font-weight: 700; margin-bottom: 6px; }
  .oqc-sec-title .km, .oqc-sec-title .en { display: inline; }
  .oqc-foot td { vertical-align: top; }
  @media (max-width: 1100px) {
    .oqc-cols { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 860px) {
    .oqc-head { grid-template-columns: minmax(0, 1fr); text-align: center; }
    .oqc-ref { justify-self: center; justify-items: center; text-align: center; }
    .oqc-info-wrap, .oqc-foot-wrap { overflow-x: auto; }
    .oqc-info, .oqc-foot { min-width: 640px; }
  }
  @media print {
    @page { size: A4 portrait; margin: 8mm; }
    body { display: block; height: auto; overflow: visible; background: #fff; }
    .topbar, .sidebar, .scrim, .crumbs, .content h1, .oqc-toolbar { display: none !important; }
    .layout { display: block; }
    .content { overflow: visible; padding: 0; }
    .panel { padding: 0; border: 0; box-shadow: none; background: none; }
    .oqc-sheet { border-radius: 0; font-size: 11px; }
    .oqc-cols { grid-template-columns: 1fr 1fr; }
    .oqc-sheet input, .oqc-sheet textarea { background: none; resize: none; }
    .oqc-sheet select.res { -webkit-appearance: none; appearance: none; border: 0; }
    .oqc-prob { background: none; }
    .oqc-prob button[aria-pressed="false"] { display: none; }
    .oqc-prob button { box-shadow: none !important; }
    .oqc-sheet input::placeholder { color: transparent; }
    body.print-oqc #oqcForm, body.print-oqc .readonly-note { display: none !important; }
    body.print-oqc #oqcPrintPages { display: block; }
    body.print-oqc #oqcPrintPages .oqc-sheet { break-after: page; }
    body.print-oqc #oqcPrintPages .oqc-sheet:last-child { break-after: auto; }
    /* SPEC print: only the filled "Spec.xlsx" layout */
    @page spec { size: A4 portrait; margin: 6mm; }
    body.print-spec > *:not(#printArea) { display: none !important; }
    body.print-spec #printArea { display: block; position: static; page: spec; }
  }

  /* Print layout generated from "Spec.xlsx" (spec-print.js) */
  #printArea { display: none; }
  #printArea.measure { display: block; position: absolute; left: -100000px; top: 0; }
  .spt { border-collapse: collapse; table-layout: fixed; background: #fff; color: #000;
    font-family: "Times New Roman", "Khmer OS", "Noto Sans Khmer", serif; line-height: 1.15; }
  .spt td { padding: 0 2px; overflow: visible; white-space: pre; }
  .spt td.v-big { font-size: 14pt; font-weight: 700; text-align: center; vertical-align: middle; white-space: normal; }
  .spt td.v-text { font-size: 10pt; text-align: left; vertical-align: top; padding: 2px 6px; white-space: pre-wrap; word-break: break-word; }
  .spt td.v-pos { font-size: 12pt; font-weight: 700; text-align: center; vertical-align: middle; white-space: normal; }
  .spt td.v-spec { font-size: 11pt; text-align: center; vertical-align: middle; white-space: normal; }

  /* In-app dialog (replaces the browser's confirm/alert boxes) */
  .dlg-scrim {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
    background: rgba(5,46,34,.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .18s ease;
  }
  .dlg-scrim.show { opacity: 1; }
  .dlg {
    width: min(100%, 400px); padding: 26px 24px 20px; border-radius: 28px; text-align: center;
    background: linear-gradient(160deg, rgba(255,255,255,.96), rgba(240,253,247,.94));
    border: 1px solid rgba(255,255,255,.9); box-shadow: 0 30px 70px -20px rgba(5,46,34,.45), 0 0 0 1px rgba(5,150,105,.08);
    transform: translateY(14px) scale(.94); transition: transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .dlg-scrim.show .dlg { transform: none; }
  .dlg-ic {
    width: 64px; height: 64px; margin: -4px auto 14px; border-radius: 22px; display: grid; place-items: center; font-size: 30px;
    background: linear-gradient(135deg, #d1fae5, #a7f3d0); box-shadow: 0 10px 24px -10px rgba(5,150,105,.6); transform: rotate(-6deg);
  }
  .dlg.danger .dlg-ic { background: linear-gradient(135deg, #fee2e2, #fecaca); box-shadow: 0 10px 24px -10px rgba(220,38,38,.55); }
  .dlg.info .dlg-ic { background: linear-gradient(135deg, #fef3c7, #fde68a); box-shadow: 0 10px 24px -10px rgba(217,119,6,.5); }
  .dlg h2 { font-size: 20px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 6px; }
  .dlg p { font-size: 14.5px; line-height: 1.5; color: var(--ink-soft); overflow-wrap: anywhere; }
  .dlg p b { color: var(--ink); }
  .dlg p:has(br) { text-align: left; max-height: 50vh; overflow-y: auto; }
  .dlg-actions { display: flex; gap: 10px; margin-top: 22px; }
  .dlg-btn {
    flex: 1; height: 46px; border-radius: 16px; cursor: pointer; font-family: inherit; font-size: 14.5px; font-weight: 800;
    transition: transform .15s, box-shadow .2s, background .2s;
  }
  .dlg-btn:active { transform: scale(.97); }
  .dlg-btn:focus-visible { outline: 3px solid rgba(5,150,105,.35); outline-offset: 2px; }
  .dlg-btn.ghost { background: rgba(5,150,105,.08); border: 1.5px solid transparent; color: var(--ink); }
  .dlg-btn.ghost:hover { background: rgba(5,150,105,.14); }
  .dlg-btn.go { border: 0; color: #fff; background: linear-gradient(110deg, var(--accent-1), var(--accent-2)); box-shadow: 0 12px 22px -10px rgba(5,150,105,.75); }
  .dlg.danger .dlg-btn.go { background: linear-gradient(110deg, #dc2626, #fb7185); box-shadow: 0 12px 22px -10px rgba(220,38,38,.7); }
  .dlg.danger .dlg-btn:focus-visible { outline-color: rgba(220,38,38,.35); }
  .dlg-btn.go:hover { box-shadow: 0 16px 26px -10px rgba(5,150,105,.85); transform: translateY(-1px); }
  @media print { .dlg-scrim { display: none !important; } }

  /* Language switch (top bar) */
  .lang-switch { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(5,150,105,.08); }
  .side-foot .lang-switch button { flex: 1; }
  /* Sidebar footer: language switch + signed-in user + logout */
  .side-foot {
    display: grid; gap: 10px; padding: 12px 14px 14px; border-top: 1px solid var(--line);
    background: rgba(255,255,255,.55);
  }
  .user-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 16px; background: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.9); }
  .user-row .user { flex: 1; min-width: 0; }
  .user-row .meta { min-width: 0; }
  .user-row .name, .user-row .role { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-row #logout { flex: none; }
  .lang-switch button {
    height: 30px; min-width: 44px; padding: 0 10px; border: 0; border-radius: 9px; background: none; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 800; color: var(--ink-soft); transition: background .2s, color .2s;
  }
  .lang-switch button[aria-pressed="true"] { background: linear-gradient(110deg, var(--accent-1), var(--accent-2)); color: #fff; box-shadow: 0 6px 14px -8px rgba(5,150,105,.8); }
  html[lang="km"] body { line-height: 1.5; }

  /* Busy: a request to the server/database is running */
  body.busy, body.busy * { cursor: wait !important; }
  .busy-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .busy-bar::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%;
    background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-2), transparent); animation: busy-slide 1s ease-in-out infinite; }
  body.busy .busy-bar { opacity: 1; }
  @keyframes busy-slide { to { left: 100%; } }
  .spinner { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid rgba(5,150,105,.2); border-top-color: var(--accent-1); animation: spin .7s linear infinite; display: none; }
  body.busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy-note { display: none; font-size: 12px; font-weight: 700; color: var(--accent-1); white-space: nowrap; }
  body.busy .busy-note { display: inline; }
  @media print { .busy-bar { display: none; } }

  .scrim { display: none; }

  /* Mobile: sidebar becomes a slide-in drawer */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; top: 64px; bottom: 0; left: 0; width: min(86vw, var(--sidebar-w)); z-index: 2;
      background: rgba(247,255,251,.96); transform: translateX(-100%); transition: transform .25s ease;
    }
    body.nav-open .sidebar { transform: none; box-shadow: 20px 0 40px -20px rgba(5,46,34,.35); }
    body.nav-open .scrim { display: block; position: fixed; inset: 64px 0 0; z-index: 1; background: rgba(5,46,34,.2); }
    .content { padding: 20px 16px; }

    .topbar { gap: 8px; padding: 0 12px; }
    .brand { font-size: 15px; min-width: 0; white-space: nowrap; }
  }
  @media (max-width: 480px) {
    .env-badge { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="busy-bar" aria-hidden="true"></div>
<header class="topbar">
  <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Hide menu" title="Hide menu" aria-controls="sidebar" aria-expanded="true">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand"><img src="/favicon.ico?v=2" alt=""> QC Dept App</div>
  <span class="env-badge" id="envBadge"></span>
  <div class="spacer"></div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Main menu">
    <div class="tree-tools">
      <label class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="filter" type="search" placeholder="Search menu" data-tp="ph.menu">
      </label>
      <div class="tree-actions">
        <button class="icon-btn" id="expandAll"><span class="bi" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></svg></span><span data-t="b.expandAll">Expand all</span></button>
        <button class="icon-btn" id="collapseAll"><span class="bi" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="m7 4 5 5 5-5M7 20l5-5 5 5"/></svg></span><span data-t="b.collapseAll">Collapse all</span></button>
      </div>
    </div>
    <ul class="tree" id="tree" role="tree"></ul>
    <div class="tree-empty" id="treeEmpty" data-t="menu.empty">No menu items match.</div>
    <!-- Bottom of the menu: language, signed-in user, logout -->
    <div class="side-foot">
      <div class="lang-switch" role="group" aria-label="Language / ភាសា">
        <button type="button" data-lang="km" aria-pressed="false">ខ្មែរ</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>

      <div class="user-row">

        <button class="icon-btn" id="logout" title="Logout">
          <span class="bi" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg></span>
          <span class="logout-text" data-t="b.logout">Logout</span>
        </button>
      </div>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main class="content">
    <div class="crumbs" id="crumbs"></div>
    <h1 id="title"></h1>
    <div class="panel" id="panel"></div>
  </main>
</div>

<script src="/config.js"></script>

  const treeEl = document.getElementById('tree');
  const STORE_KEY = 'qc-menu-state';
  let nodesById = {};
  let state = { open: ['master'], selected: 'dashboard' };
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch {}
  const saveState = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} };

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const countLeaves = n => n.children ? n.children.reduce((a, c) => a + countLeaves(c), 0) : 1;

  // Keep the pages this user may view; a group with no visible pages disappears
  function filterByPerm(nodes) {
    return nodes.filter(n => !n.perm || can(n.perm))
      .map(n => n.children ? { ...n, children: filterByPerm(n.children) } : n)
      .filter(n => !n.children || n.children.length);
  }

  function buildTree(nodes, parentEl, parent, level) {
    for (const n of nodes) {
      n.parent = parent;
      nodesById[n.id] = n;
      const li = document.createElement('li');
      li.setAttribute('role', 'treeitem');
      li.setAttribute('aria-level', level);
      li.dataset.id = n.id;
      const hasKids = !!(n.children && n.children.length);
      if (hasKids) li.setAttribute('aria-expanded', state.open.includes(n.id));
      li.innerHTML = `<button class="node" tabindex="-1">
          ${svg('chev', 'i chev' + (hasKids ? '' : ' blank'))}
          <span class="ic">${svg(n.icon)}</span>
          <span class="label">${esc(labelOf(n))}</span>
          ${hasKids ? `<span class="count">${countLeaves(n)}</span>` : ''}
        </button>`;
      n.li = li;
      parentEl.appendChild(li);
      if (hasKids) {
        const ul = document.createElement('ul');
        ul.setAttribute('role', 'group');
        li.appendChild(ul);
        buildTree(n.children, ul, n, level + 1);
      }
    }
  }

  function setExpanded(n, open) {
    if (!n.children || !n.children.length) return;
    n.li.setAttribute('aria-expanded', open);
    state.open = state.open.filter(id => id !== n.id);
    if (open) state.open.push(n.id);
    saveState();
  }

  function pathOf(n) { const p = []; for (let x = n; x; x = x.parent) p.unshift(x); return p; }

  function select(id, { focus = false } = {}) {
    const n = nodesById[id] || nodesById.dashboard;
    treeEl.querySelectorAll('[aria-selected="true"]').forEach(el => el.removeAttribute('aria-selected'));
    n.li.setAttribute('aria-selected', 'true');
    pathOf(n).slice(0, -1).forEach(a => setExpanded(a, true));
    setRoving(n);
    if (focus) n.li.querySelector('.node').focus();
    state.selected = n.id;
    saveState();
    renderContent(n);
    // On phones, close the drawer once a screen (not a group) is picked
    if (!(n.children && n.children.length)) document.body.classList.remove('nav-open');
  }

  const labelOf = n => t(n.k);
  function renderHeader(n) {
    document.getElementById('crumbs').innerHTML = pathOf(n).map((p, i) =>
      (i ? '<span class="sep">›</span>' : '') + `<span>${esc(labelOf(p))}</span>`).join('');
    document.getElementById('title').innerHTML = `<span class="ic-wrap">${svg(n.icon)}</span>${esc(labelOf(n))}`;
  }
  function renderContent(n) {
    renderHeader(n);

    if (SCREENS[n.id]) return SCREENS[n.id](panel);

    if (items && items.length) {

    } else {

  // ---- Screens: menu ids that have a real screen instead of the placeholder ----
  const SCREENS = { sampling: renderSampling, spec: renderSpec, daily: renderOQC, users: renderUsers, roles: renderRoles };

  // In-app dialog instead of the browser's confirm()/alert(). Resolves true for the main button, false otherwise.
  // tone: 'primary' (green) | 'danger' (red, Cancel focused first) | 'info' (amber); cancel: null for a one-button notice
  function uiDialog({ title, message, ok = t('b.ok'), cancel = t('b.cancel'), tone = 'primary', icon = '✨' }) {
    return new Promise(resolve => {
      const back = document.activeElement;
      const scrim = document.createElement('div');
      scrim.className = 'dlg-scrim';
      scrim.innerHTML = `<div class="dlg ${tone}" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgMsg">
          <div class="dlg-ic" aria-hidden="true">${icon}</div>
          <h2 id="dlgTitle">${esc(title)}</h2>
          <p id="dlgMsg">${message}</p>
          <div class="dlg-actions">
            ${cancel ? `<button type="button" class="dlg-btn ghost" data-v="0">${esc(cancel)}</button>` : ''}
            <button type="button" class="dlg-btn go" data-v="1">${ico(tone === 'danger' ? 'trash' : 'check2')}${esc(ok)}</button>
          </div>
        </div>`;
      document.body.appendChild(scrim);
      const btns = [...scrim.querySelectorAll('.dlg-btn')];
      const close = v => {
        document.removeEventListener('keydown', onKey, true);
        scrim.classList.remove('show');
        setTimeout(() => scrim.remove(), 180);
        if (back && back.focus) back.focus({ preventScroll: true });
        resolve(v);
      };
      const onKey = e => {
        if (e.key === 'Escape') { e.preventDefault(); close(false); }
        else if (e.key === 'Tab') {   // keep focus inside the dialog
          e.preventDefault();
          const i = btns.indexOf(document.activeElement);
          btns[(i + (e.shiftKey ? -1 : 1) + btns.length) % btns.length].focus();
        }
      };
      document.addEventListener('keydown', onKey, true);
      btns.forEach(b => b.onclick = () => close(b.dataset.v === '1'));
      scrim.addEventListener('mousedown', e => { if (e.target === scrim) close(false); });
      requestAnimationFrame(() => scrim.classList.add('show'));
      // Risky actions start on Cancel, so Enter doesn't delete by accident
      (tone === 'danger' && cancel ? btns[0] : btns[btns.length - 1]).focus();
    });
  }
  const uiConfirm = opts => uiDialog(opts);
  const uiAlert = opts => uiDialog({ cancel: null, tone: 'info', icon: '⚠️', ...opts });

  // Permissions of the signed-in user (from /api/me); the server checks them again on every call
  const can = k => !!(currentUser && Array.isArray(currentUser.perms) && currentUser.perms.includes(k));

  // While any request runs: wait cursor + loading bar (body.busy)
  let busyCount = 0;
  function setBusy(on) {
    busyCount = Math.max(0, busyCount + (on ? 1 : -1));
    document.body.classList.toggle('busy', busyCount > 0);
  }

  async function api(method, url, body) {
    setBusy(true);
    try {
      const res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
      if (res.status === 401) { location.replace('/'); throw new Error(t('e.session')); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error ? trServer(data.error) : t('e.request', { status: res.status })), { status: res.status, data });
      return data;
    } catch (err) {
      throw err instanceof TypeError ? new Error(t('e.server')) : err;
    } finally { setBusy(false); }
  }
  // POST the record to /api/excel/<kind> and save the .xlsx the server returns.
  // kind: 'oqc' -> "OQC Data.xlsx", 'spec' -> "Spec.xlsx"
  async function downloadExcel(kind, fileName, pages) {
    setBusy(true);
    try {
      const res = await fetch(`/api/excel/${kind}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileName, itemList: OQC_ITEMS.map(i => [i[0], i[1]]), pages }) });
      if (res.status === 401) { location.replace('/'); throw new Error(t('e.session')); }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error ? trServer(data.error) : t('e.request', { status: res.status }));
      }
      const blob = await res.blob();
      const name = (/filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '') || [])[1] || `${fileName}.xlsx`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      return name;
    } catch (err) {
      throw err instanceof TypeError ? new Error(t('e.server')) : err;
    } finally { setBusy(false); }
  }
  const fmtDate = d => d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

  // Sampling Plan: Level + Shipment Qty range ("101-150") -> sample Qty
  function renderSampling(panel) {
    let rows = [], editId = 0, level = 'Normal';
    // Add / Edit / Delete follow Roles & Permissions (the server enforces them too)
    const canAdd = can('sampling.add'), canEdit = can('sampling.edit'), canDel = can('sampling.delete');

    function drawTables() {

        list.forEach((r, i) => {
          const prev = list[i - 1];

          }
          body += `<tr class="${r.id === editId ? 'editing' : ''}">
            <td class="num">${r.qtyFrom}-${r.qtyTo}</td>

          <div class="table-wrap"><table class="data">

            <tbody>${body || `<tr><td colspan="4" class="empty-row">${esc(t('sp.none', { level: LVL(l) }))}</td></tr>`}</tbody>
          </table></div>`;
      }).join('');

    async function load() {
      try { rows = await api('GET', '/api/sampling'); drawTables(); }
      catch (e) { msg(e.message); }
    }

    $('spTables').onclick = async e => {
      const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
      if (ed) {
        $('spForm').hidden = false;
        const r = rows.find(x => x.id === Number(ed.dataset.edit));

        drawTables();
        $('spRange').focus();
      }
      if (del) {
        const r = rows.find(x => x.id === Number(del.dataset.del));
        if (!await uiConfirm({ tone: 'danger', icon: '🗑️', title: t('sp.delT'),
          message: t('sp.delM', { level: LVL(r.level), range: `${r.qtyFrom}-${r.qtyTo}`, qty: r.sampleQty }),
          ok: t('b.delete'), cancel: t('b.keep') })) return;
        try {
          await api('DELETE', `/api/sampling/${r.id}`);
          if (editId === r.id) resetForm();
          msg(t('sp.deleted', { level: LVL(r.level), range: `${r.qtyFrom}-${r.qtyTo}` }), 'ok');
          await load();
        } catch (err) { msg(err.message); }

    $('spForm').onsubmit = async e => {
      e.preventDefault();

    let rows = [], editId = 0, mode = '';   // mode: '' (closed) | 'new' | 'edit' | 'copy' | 'view'
    // OQC record info row with an Item Code column after Customer
    const INFO = [OQC_INFO[0], ['', 'Item Code'], ...OQC_INFO.slice(1)];
    // Cells that are only filled in during an inspection show as greyed blanks
    const na = (attrs = '') => `<td class="na" ${attrs}></td>`;

    const lenTable = from => `<table class="oqc oqc-len">
        <thead>
          <tr><th class="c" rowspan="2">№</th><th rowspan="2">${bi('ទីតាំងប្រវែង', 'Length Position')}</th>
            <th rowspan="2">${bi('តំលៃប្រវែងកំនត់', 'SPEC')}</th><th class="c" colspan="5">Sample</th></tr>
          <tr>${OQC_CIRC.map(c => `<th class="c">${c}</th>`).join('')}</tr>
        </thead>
        <tbody>${Array.from({ length: 11 }, (_, k) => from + k).map(i => `<tr>
          <td class="no">${i}</td>
          <td class="pos"><input data-pos="${i}" maxlength="50" aria-label="Length position ${i}"></td>
          <td class="spc"><input data-spec="${i}" maxlength="50" aria-label="SPEC ${i}" placeholder="20±5"></td>
          ${OQC_CIRC.map(() => na()).join('')}</tr>`).join('')}
          <tr class="sec"><td colspan="3">${bi('លទ្ធផល', 'Result')}</td>${na('colspan="5"')}</tr>
        </tbody></table>`;

    panel.innerHTML = `
      <div class="readonly-note" ${canAdd || canEdit || canDel ? 'hidden' : ''}>${svg('lock')} ${T('sc.readonly')}</div>
      <div class="msg" id="scMsg" role="status"></div>
      <form class="oqc-sheet spec-editor" id="scForm" novalidate autocomplete="off" hidden>
        <div class="spec-edit-bar">
          <h3><span id="scTitle"></span><small id="scSub"></small></h3>
          <div class="form-actions">
            <button class="icon-btn" id="scPrint" type="button">${ico('excel')}${T('b.excel')}</button>
            <button class="icon-btn" id="scCancel" type="button">${ico('x')}${T('b.cancel')}</button>
            <button class="btn-primary" id="scSave" type="submit">${ico('save')}${T('b.save')}</button>
          </div>
        </div>
        ${oqcHead(`<span>${bi('ថ្ងៃត្រួតពិនិត្យ', 'CHECK DATE')}</span>`)}

        <div class="oqc-info-wrap"><table class="oqc oqc-info">
          <tr>${INFO.map(([km, en]) => `<th class="c">${km ? bi(km, en) : en}</th>`).join('')}</tr>
          <tr>${INFO.map(([, en]) => en === 'CUSTOMER'
            ? `<td><input id="scCustomer" class="big" maxlength="100" aria-label="Customer"></td>`
            : en === 'Item Code' ? `<td><input id="scItem" class="big" maxlength="50" aria-label="Item Code" placeholder="FM4-H915-000"></td>`
            : en === 'PART №' ? `<td><input id="scPart" class="big" maxlength="100" aria-label="Part No"></td>` : na()).join('')}</tr>
        </table></div>

        <div class="oqc-cols">
          <table class="oqc">
            <tr><th>${bi('ប្រការត្រូវពិនិត្យ', 'INSPECTION ITEM')}</th><th class="c">${bi('លទ្ធផល', 'Result')}</th></tr>
            <tr class="sec"><td>${bi('1) ត្រួតពិនិត្យវត្ថុធាតុដើម', 'MATERIAL CHECK')}</td>${na()}</tr>
            ${MATERIAL.map(([k, n, km, en]) => `<tr><td colspan="2">
              <div class="oqc-sec-title">${n} <span class="km">${km}</span> <span class="en">[${en}]</span></div>
              <textarea id="sc-${k}" rows="2" maxlength="1000" aria-label="${en}"></textarea></td></tr>`).join('')}
          </table>
          <table class="oqc">
            <tr><th>${bi('ប្រការត្រូវពិនិត្យ', 'INSPECTION ITEM')}</th><th class="c">${bi('លទ្ធផល', 'Result')}</th></tr>
            ${OQC_ITEMS.map(([km, en]) => `<tr><td>${bi(km, en)}</td>${na()}</tr>`).join('')}
          </table>
        </div>

        <div>
          <div class="oqc-sec-title"><span class="km">2) ត្រួតពិនិត្យប្រវែង</span> <span class="en">[Length Check]</span></div>
          <div class="oqc-cols">
            <div class="oqc-len-wrap">${lenTable(1)}</div>
            <div class="oqc-len-wrap">${lenTable(12)}</div>
          </div>
        </div>

        <div class="oqc-foot-wrap"><table class="oqc oqc-foot">
          <tr>
            <td rowspan="2" style="width:52%">${bi('កំនត់សំគាល់', 'Remarks')}</td>
            <th class="c">${bi('អនុម័តដោយ', 'Approved by')}</th>
            <th class="c">${bi('ត្រួតពិនិត្យដោយ', 'Checked by')}</th>
            <th class="c">${bi('អ្នកត្រួតពិនិត្យ', 'Inspector')}</th>
          </tr>
          <tr>${na()}${na()}${na()}</tr>
        </table></div>
      </form>
      <div class="spec-bar">
        <label class="search">${svg('list')}<input id="scSearch" type="search" ${P('ph.scSearch')} aria-label="Search SPEC"></label>
        ${canAdd ? `<button class="btn-primary" id="scAdd" type="button">${ico('plus')}${T('b.add')}</button>` : ''}
        <span class="count" id="scCount"></span>
        <span class="spinner" aria-hidden="true"></span><span class="busy-note">${T('loading')}</span>
      </div>
      <div class="table-wrap spec-list"><table class="data">
        <thead><tr>${['h.customer', 'h.itemCode', 'h.partNo', 'h.wire', 'h.terminal', 'h.housing', 'h.other', 'h.length', 'h.lastUpdated'].map(k => `<th>${T(k)}</th>`).join('')}<th></th></tr></thead>
        <tbody id="scBody"></tbody>
      </table></div>`;

    const $ = id => panel.querySelector('#' + id);
    const msg = (text, kind = 'err') => { $('scMsg').textContent = text; $('scMsg').className = 'msg ' + kind; };
    const s = v => esc(String(v ?? ''));

    function drawList() {
      const q = $('scSearch').value.trim().toLowerCase();
      const hit = r => !q || [r.itemCode, r.customer, r.partNo, r.wire, r.terminal, r.housing, r.other, ...r.lengths.flatMap(l => [l.position, l.spec])]
        .some(v => String(v || '').toLowerCase().includes(q));
      const list = rows.filter(hit);
      $('scCount').textContent = q ? t('sc.countOf', { n: list.length, total: rows.length }) : t('sc.count', { n: rows.length });
      $('scBody').innerHTML = list.map(r => `<tr class="${r.id === editId && mode === 'edit' ? 'editing' : r.id === editId && mode === 'copy' ? 'copying' : ''}">
          <td>${s(r.customer)}</td>
          <td class="num">${s(r.itemCode)}</td>
          <td>${s(r.partNo)}</td>
          ${['wire', 'terminal', 'housing', 'other'].map(k => `<td class="txt" title="${s(r[k])}">${s(r[k])}</td>`).join('')}
          <td class="num">${r.lengths.length}</td>
          <td class="meta">${s(r.updateBy)} · ${fmtDate(r.updateDate)}</td>
          <td><div class="row-actions">
            <button class="icon-btn" data-act="view" data-id="${r.id}">${ico('eye')}${T('b.view')}</button>
            ${canExcel ? `<button class="icon-btn" data-act="print" data-id="${r.id}">${ico('excel')}${T('b.excel')}</button>` : ''}
            ${canEdit ? `<button class="icon-btn" data-act="edit" data-id="${r.id}">${ico('pencil')}${T('b.edit')}</button>` : ''}
            ${canAdd ? `<button class="icon-btn" data-act="copy" data-id="${r.id}">${ico('copy')}${T('b.copy')}</button>` : ''}
            ${canDel ? `<button class="icon-btn del" data-act="del" data-id="${r.id}">${ico('trash')}${T('b.delete')}</button>` : ''}</div></td>
        </tr>`).join('') || `<tr><td colspan="10" class="empty-row">${esc(t(rows.length ? 'sc.noMatch' : 'sc.none'))}</td></tr>`;
    }

    // Open the editor: 'new' = blank, 'edit' = this row, 'copy' = this row's data with a blank ItemCode, 'view' = read-only
    function openEditor(m, r) {
      mode = m; editId = r ? r.id : 0; looked = m === 'edit' ? r.itemCode : '';
      $('scForm').reset();
      if (r) {
        $('scItem').value = m === 'copy' ? '' : r.itemCode;
        $('scCustomer').value = r.customer || '';
        $('scPart').value = r.partNo || '';
        MATERIAL.forEach(([k]) => $('sc-' + k).value = r[k] || '');
        r.lengths.forEach(l => {
          const p = panel.querySelector(`[data-pos="${l.no}"]`), sp = panel.querySelector(`[data-spec="${l.no}"]`);
          if (p) p.value = l.position; if (sp) sp.value = l.spec;
        });
      }
      edR = r;
      setEditorTitle();
      $('scForm').querySelectorAll('input, textarea').forEach(i => i.disabled = m === 'view');
      $('scSave').hidden = m === 'view' || (m === 'edit' ? !canEdit : !canAdd);
      $('scPrint').hidden = !canExcel;

      panel.querySelectorAll('.bad').forEach(i => i.classList.remove('bad'));
      $('scForm').hidden = false;
      fitText();
      msg('');
      drawList();
      $('scForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (m !== 'view') (m === 'edit' ? $('scCustomer') : $('scItem')).focus({ preventScroll: true });
    }
    let edR = null;
    function setEditorTitle() {
      if (!mode) return;
      $('scTitle').textContent = mode === 'new' ? t('sc.new') : mode === 'edit' ? t('sc.edit', { code: edR.itemCode })
        : mode === 'copy' ? t('sc.copyT') : edR.itemCode;
      $('scSub').textContent = mode === 'copy' ? t('sc.copiedFrom', { code: edR.itemCode }) : '';
      $('scCancel').innerHTML = ico('x') + T(mode === 'view' ? 'b.close' : 'b.cancel');
    }
    function closeEditor() { mode = ''; editId = 0; $('scForm').hidden = true; drawList(); }

    async function load() {
      try { rows = await api('GET', '/api/spec'); drawList(); }
      catch (e) { msg(e.message); }
    }

    // Item Code -> Part No (Marunix item) + Wire / Terminal / Housing / Other (BOM RM Names by QC Type)
    let looked = '';
    async function lookupItem() {
      const code = $('scItem').value.trim();
      if (!code || code === looked || mode === 'view') return;
      looked = code;
      try {
        const r = await api('GET', `/api/spec/lookup?itemCode=${encodeURIComponent(code)}`);
        if ($('scItem').value.trim() !== code) return;   // typed something else meanwhile
        if (r.partNo) $('scPart').value = r.partNo;
        MATERIAL.forEach(([k]) => $('sc-' + k).value = r[k]);
        fitText();
        const notes = [t('sc.bom', { n: r.bomRows })];
        if (r.eol) notes.push(t('sc.eol', { list: r.eol }));
        if (r.unclassified.length) notes.push(t('sc.unclass', { list: r.unclassified.map(u => `${u.code} ${u.name}`).join(', ') }));
        msg(notes.join(' · '), r.unclassified.length ? 'err' : 'ok');
      } catch (err) { looked = ''; msg(err.message); }   // allow a retry of the same code
    }
    $('scItem').addEventListener('change', lookupItem);
    // Enter in Item Code looks it up instead of saving the form
    $('scItem').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); looked = ''; lookupItem(); } });

    // Grow the material boxes to fit their text, so long BOM lists are fully visible and printed
    const fitText = () => MATERIAL.forEach(([k]) => { const t = $('sc-' + k); t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; });
    MATERIAL.forEach(([k]) => $('sc-' + k).addEventListener('input', fitText));
    // Values on screen (for the editor's Print button)
    function formData() {
      const d = { customer: $('scCustomer').value.trim(), partNo: $('scPart').value.trim(), lengths: [] };
      MATERIAL.forEach(([k]) => d[k] = $('sc-' + k).value.trim());
      for (let i = 1; i <= 22; i++) {
        d.lengths.push({ no: i, position: panel.querySelector(`[data-pos="${i}"]`).value.trim(), spec: panel.querySelector(`[data-spec="${i}"]`).value.trim() });
      }
      return d;
    }
    // SPEC -> Excel: one page with Customer, Part No, material text and the length Position / SPEC rows
    async function specExcel(r, code) {
      const page = { customer: r.customer || '', partNo: r.partNo || '', items: {}, total: '',
        material: { wire: r.wire || '', terminal: r.terminal || '', housing: r.housing || '', other: r.other || '' },
        lengths: (r.lengths || []).map(l => ({ no: l.no, position: l.position || '', spec: l.spec || '', samples: [] })) };
      try {
        const file = await downloadExcel('spec', `SPEC_${code || r.itemCode || 'new'}`, [page]);
        msg(t('o.excelDone', { file }), 'ok');
      } catch (err) { msg(err.message); }
    }
    $('scPrint').onclick = () => specExcel(formData(), $('scItem').value.trim());

    $('scSearch').addEventListener('input', drawList);
    if (canAdd) $('scAdd').onclick = () => openEditor('new');
    $('scCancel').onclick = () => { closeEditor(); msg(''); };

    $('scBody').onclick = async e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const r = rows.find(x => x.id === Number(b.dataset.id)); if (!r) return;
      if (b.dataset.act === 'print') return specExcel(r, r.itemCode);
      if (b.dataset.act !== 'del') return openEditor(b.dataset.act, r);
      if (!await uiConfirm({ tone: 'danger', icon: '🗑️', title: t('sc.delT'),
        message: t('sc.delM', { code: esc(r.itemCode), part: r.partNo ? ` (${esc(r.partNo)})` : '' }),
        ok: t('b.delete'), cancel: t('b.keep') })) return;
      try {
        await api('DELETE', `/api/spec/${r.id}`);
        if (editId === r.id) closeEditor();
        msg(t('sc.deleted', { code: r.itemCode }), 'ok');
        await load();
      } catch (err) { msg(err.message); }
    };

    $('scForm').onsubmit = async e => {
      e.preventDefault();
      if (mode === 'view') return;
      panel.querySelectorAll('.bad').forEach(i => i.classList.remove('bad'));
      const itemCode = $('scItem').value.trim();
      if (!itemCode) { $('scItem').classList.add('bad'); $('scItem').focus(); return msg(t('sc.needCode')); }
      const body = { itemCode, customer: $('scCustomer').value.trim(), partNo: $('scPart').value.trim(), lengths: [] };
      MATERIAL.forEach(([k]) => body[k] = $('sc-' + k).value.trim());
      for (let i = 1; i <= 22; i++) {
        const position = panel.querySelector(`[data-pos="${i}"]`).value.trim(), spec = panel.querySelector(`[data-spec="${i}"]`).value.trim();
        if (position || spec) body.lengths.push({ no: i, position, spec });
      }
      $('scSave').disabled = true;
      try {
        if (mode === 'edit') await api('PUT', `/api/spec/${editId}`, body);
        else await api('POST', '/api/spec', body);
        msg(t(mode === 'edit' ? 'sc.saved' : 'sc.added', { code: itemCode }), 'ok');
        closeEditor();
        await load();
      } catch (err) {
        if (/Item Code/.test(err.message)) { $('scItem').classList.add('bad'); $('scItem').focus(); }
        msg(err.message);
      } finally { $('scSave').disabled = false; }
    };

    langHook = () => { drawList(); setEditorTitle(); };
    load();
  }

  // User Management: everyone in tbUser; add / edit / delete follow Roles & Permissions (passwords are never loaded)
  function renderUsers(panel) {
    let rows = [], editId = '';
    const canAdd = can('users.add'), canEdit = can('users.edit'), canDel = can('users.delete');
    const me = String(currentUser && currentUser.id || '').trim();
    panel.innerHTML = `
      <form class="form-grid users-form" id="usForm" novalidate autocomplete="off" ${canAdd ? '' : 'hidden'}>
        <label class="fld">${T('u.id')} <input id="usId" maxlength="10" ${P('u.phId')} autocomplete="off"></label>
        <label class="fld">${T('u.name')} <input id="usName" maxlength="80" ${P('u.phName')} autocomplete="off"></label>
        <label class="fld">${T('u.password')} <input id="usPass" type="password" maxlength="100" autocomplete="new-password"></label>
        <label class="fld">${T('u.role')} <select id="usRole"><option value="User">User</option><option value="Admin">Admin</option></select></label>
        <label class="fld">${T('u.dept')} <input id="usDept" maxlength="50" list="usDepts" ${P('u.phDept')} autocomplete="off"></label>
        <datalist id="usDepts"></datalist>
        <div class="form-actions">
          <button class="btn-primary" id="usSubmit" type="submit">${ico('plus')}${T('b.add')}</button>
          <button class="icon-btn" id="usCancel" type="button" hidden>${ico('x')}${T('b.cancel')}</button>
        </div>
      </form>
      <div class="spec-bar">
        <label class="search">${svg('search')}<input id="usSearch" type="search" ${P('u.search')} aria-label="Search users"></label>
        <span class="count" id="usCount"></span>
        <span class="spinner" aria-hidden="true"></span><span class="busy-note">${T('loading')}</span>
      </div>
      <div class="msg" id="usMsg" role="status"></div>
      <div class="table-wrap"><table class="data">
        <thead><tr>${['u.id', 'u.name', 'u.role', 'u.dept', 'u.created', 'u.updated'].map(k => `<th>${T(k)}</th>`).join('')}<th></th></tr></thead>
        <tbody id="usBody"></tbody>
      </table></div>`;
    const $ = id => panel.querySelector('#' + id);
    const s = v => esc(String(v ?? ''));
    const msg = (text, kind = 'err') => { $('usMsg').textContent = text; $('usMsg').className = 'msg ' + kind; };
    const sameId = (a, b) => String(a ?? '').trim().toLowerCase() === String(b ?? '').trim().toLowerCase();
    const setPassHint = () => $('usPass').placeholder = t(editId ? 'u.phPassKeep' : 'u.phPass');

    function resetForm() {
      editId = '';
      $('usForm').reset();
      $('usId').disabled = false;
      $('usSubmit').innerHTML = ico('plus') + T('b.add');
      $('usCancel').hidden = true;
      $('usForm').hidden = !canAdd;
      setPassHint();
      panel.querySelectorAll('.bad').forEach(i => i.classList.remove('bad'));
      draw();
    }
    $('usCancel').onclick = () => { resetForm(); msg(''); };

    function draw() {
      const q = $('usSearch').value.trim().toLowerCase();
      const list = rows.filter(r => !q || [r.id, r.username, r.role, r.dept].some(v => String(v || '').toLowerCase().includes(q)));
      $('usCount').textContent = q ? t('u.countOf', { n: list.length, total: rows.length }) : t('u.count', { n: rows.length });
      $('usBody').innerHTML = list.map(r => {
        const id = String(r.id).trim(), self = sameId(id, me);
        return `<tr class="${editId && sameId(id, editId) ? 'editing' : ''}">
          <td class="num">${s(id)}</td>
          <td><span class="u-name"><span class="u-av">${s(String(r.username || '?').trim().charAt(0).toUpperCase())}</span>${s(r.username)}</span></td>
          <td><span class="pill ${r.role === 'Admin' ? 'admin' : 'user'}">${s(r.role)}</span></td>
          <td>${r.dept ? `<span class="pill dept">${s(r.dept)}</span>` : `<span class="meta">${esc(t('u.noDept'))}</span>`}</td>
          <td class="meta">${s(r.regBy)} · ${fmtDate(r.regDate)}</td>
          <td class="meta">${s(r.updateBy)} · ${fmtDate(r.updateDate)}</td>
          <td>${canEdit || canDel ? `<div class="row-actions">
            ${canEdit ? `<button class="icon-btn" data-edit="${s(id)}">${ico('pencil')}${T('b.edit')}</button>` : ''}
            ${canDel && !self ? `<button class="icon-btn del" data-del="${s(id)}">${ico('trash')}${T('b.delete')}</button>` : ''}
          </div>` : ''}</td></tr>`;
      }).join('') || `<tr><td colspan="7" class="empty-row">${esc(t('u.none'))}</td></tr>`;
    }

    function setRows(list) {
      rows = list;
      const depts = [...new Set(['QC', ...rows.map(r => String(r.dept || '').trim()).filter(Boolean)])].sort();
      $('usDepts').innerHTML = depts.map(d => `<option value="${s(d)}">`).join('');
      draw();
    }
    async function load() {
      try { setRows(await api('GET', '/api/users')); } catch (err) { msg(err.message); }
    }

    $('usBody').onclick = async e => {
      const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
      if (ed) {
        const r = rows.find(x => sameId(x.id, ed.dataset.edit));
        if (!r) return;
        editId = String(r.id).trim();
        $('usForm').hidden = false;
        $('usId').value = editId; $('usId').disabled = true;
        $('usName').value = String(r.username || '').trim();
        $('usPass').value = '';
        $('usRole').value = r.role === 'Admin' ? 'Admin' : 'User';
        $('usDept').value = String(r.dept || '').trim();
        setPassHint();
        $('usSubmit').innerHTML = ico('save') + T('b.save');
        $('usCancel').hidden = false;
        panel.querySelectorAll('.bad').forEach(i => i.classList.remove('bad'));
        msg(t('u.editing', { id: editId, name: String(r.username || '').trim() }), 'ok');
        draw();
        $('usName').focus();
      }
      if (del) {
        const r = rows.find(x => sameId(x.id, del.dataset.del));
        if (!r) return;
        const id = String(r.id).trim(), name = String(r.username || '').trim();
        if (!await uiConfirm({ tone: 'danger', icon: '🗑️', title: t('u.delT'),
          message: t('u.delM', { id: esc(id), name: esc(name) }), ok: t('b.delete'), cancel: t('b.keep') })) return;
        try {
          setRows(await api('DELETE', `/api/users/${encodeURIComponent(id)}`));
          if (sameId(editId, id)) resetForm();
          msg(t('u.deleted', { id, name }), 'ok');
        } catch (err) { msg(err.message); }
      }
    };

    $('usForm').onsubmit = async e => {
      e.preventDefault();
      panel.querySelectorAll('.bad').forEach(i => i.classList.remove('bad'));
      const bad = (field, key) => { $(field).classList.add('bad'); $(field).focus(); msg(t(key)); };
      const body = { id: $('usId').value.trim(), username: $('usName').value.trim(), password: $('usPass').value,
        role: $('usRole').value, dept: $('usDept').value.trim() };
      if (!editId && !/^[A-Za-z0-9._-]{1,10}$/.test(body.id)) return bad('usId', 'u.errId');
      if (!body.username) return bad('usName', 'u.errName');
      if (!editId && !body.password) return bad('usPass', 'u.errPass');

      $('usSubmit').disabled = true;
      try {
        if (editId) setRows(await api('PUT', `/api/users/${encodeURIComponent(editId)}`, body));
        else setRows(await api('POST', '/api/users', body));
        msg(t(editId ? 'u.saved' : 'u.added', { id: editId || body.id, name: body.username }), 'ok');
        // Changing your own role or department changes what you may do, so reload to get the new permissions
        if (editId && sameId(editId, me)) { setTimeout(() => location.reload(), 900); return; }
        resetForm();
        $('usId').focus();
      } catch (err) {
        if (/already exists|^ID\b/i.test(err.message)) $('usId').classList.add('bad');
        msg(err.message);
      } finally { $('usSubmit').disabled = false; }
    };

    $('usSearch').addEventListener('input', draw);
    langHook = () => { draw(); setPassHint(); };
    setPassHint();
    load();
  }

  // Roles & Permissions: one row per user, one tick per page (View) and button (Add / Edit / Delete / Excel)
  const PERM_GROUPS = [
    { k: 'm.sampling', keys: ['sampling.view', 'sampling.add', 'sampling.edit', 'sampling.delete'] },
    { k: 'm.spec', keys: ['spec.view', 'spec.add', 'spec.edit', 'spec.delete', 'spec.excel'] },
    { k: 'm.daily', keys: ['daily.view', 'daily.add', 'daily.edit', 'daily.excel'] },
    { k: 'm.users', keys: ['users.view', 'users.add', 'users.edit', 'users.delete'] },
    { k: 'm.roles', keys: ['roles.view', 'roles.edit'] }
  ];
  function renderRoles(panel) {
    const canEdit = can('roles.edit');
    let users = [], orig = new Map(), draft = new Map();
    const KEYS = PERM_GROUPS.flatMap(g => g.keys);
    const groupOf = k => PERM_GROUPS.find(g => g.keys.includes(k));
    panel.innerHTML = `
      <div class="readonly-note" ${canEdit ? 'hidden' : ''}>${svg('lock')} ${T('r.readonly')}</div>
      <p class="perm-hint">${T('r.hint')}</p>
      <div class="spec-bar">
        <label class="search">${svg('search')}<input id="pmSearch" type="search" ${P('r.search')} aria-label="Search users"></label>
        <span class="count" id="pmCount"></span>
        <span class="spinner" aria-hidden="true"></span><span class="busy-note">${T('loading')}</span>

        <thead>
          <tr><th rowspan="2" class="sticky">${T('r.user')}</th>
            ${PERM_GROUPS.map(g => `<th colspan="${g.keys.length}" class="grp">${T(g.k)}</th>`).join('')}
            <th rowspan="2"></th></tr>
          <tr>${KEYS.map(k => `<th class="act"><button type="button" data-col="${k}" ${canEdit ? '' : 'disabled'} title="${esc(t('r.all'))}">${T('p.' + k.split('.')[1])}</button></th>`).join('')}</tr>

    const $ = id => panel.querySelector('#' + id);

    const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
    const changedIds = () => users.map(u => u.id).filter(id => !sameSet(orig.get(id), draft.get(id)));

    function load(list) {
      users = list;
      orig = new Map(list.map(u => [u.id, new Set(u.perms)]));
      draft = new Map(list.map(u => [u.id, new Set(u.perms)]));
      draw();

    function draw() {
      const q = $('pmSearch').value.trim().toLowerCase();
      const list = users.filter(u => !q || [u.id, u.username, u.role, u.dept].some(v => String(v || '').toLowerCase().includes(q)));
      $('pmCount').textContent = q ? t('u.countOf', { n: list.length, total: users.length }) : t('u.count', { n: users.length });
      const s2 = v => esc(String(v ?? ''));
      $('pmBody').innerHTML = list.map(u => {
        const d = draft.get(u.id), o = orig.get(u.id);
        return `<tr data-id="${s2(u.id)}"${u.id === currentUser.id ? ' class="me"' : ''}>
          <td class="sticky"><div class="pm-user">
            <span class="u-av">${s2(String(u.username || '?').trim().charAt(0).toUpperCase())}</span>
            <span class="pm-who"><b>${s2(u.username)}</b><small>${s2(u.id)} · ${s2(u.role)}${u.dept ? ' · ' + s2(u.dept) : ''}</small></span>
            <span class="pill ${u.custom ? 'custom' : 'default'}">${esc(t(u.custom ? 'r.custom' : 'r.default'))}</span>
          </div></td>
          ${KEYS.map(k => `<td class="cb${d.has(k) !== o.has(k) ? ' changed' : ''}${k.endsWith('.view') ? ' view' : ''}">
            <label class="tick"><input type="checkbox" data-k="${k}" ${d.has(k) ? 'checked' : ''} ${canEdit ? '' : 'disabled'}
              aria-label="${s2(u.username)} ${esc(t(groupOf(k).k))} ${esc(t('p.' + k.split('.')[1]))}"><span></span></label></td>`).join('')}
          <td>${canEdit && u.custom ? `<button class="icon-btn" data-reset="${s2(u.id)}" title="${esc(t('r.reset'))}">${ico('x')}${T('r.reset')}</button>` : ''}</td>

      const n = changedIds().length;
      $('pmSave').hidden = !n;

    // Tick a box: using a button needs the page's View; removing View removes that page's buttons too
    function setPerm(id, k, on) {
      const d = draft.get(id);
      const g = groupOf(k), view = g.keys[0];
      if (on) { d.add(k); d.add(view); }
      else { d.delete(k); if (k === view) g.keys.forEach(x => d.delete(x)); }

    $('pmBody').addEventListener('change', e => {

    // Column header: tick / untick that permission for every user in the list
    panel.querySelector('thead').addEventListener('click', e => {
      const b = e.target.closest('[data-col]'); if (!b || !canEdit) return;
      const ids = [...$('pmBody').querySelectorAll('tr[data-id]')].map(tr => tr.dataset.id);
      const allOn = ids.every(id => draft.get(id).has(b.dataset.col));

      if (!await uiConfirm({ icon: '↺', title: t('r.resetT', { name: u.username }), message: esc(t('r.resetM')), ok: t('r.reset'), cancel: t('b.cancel') })) return;
      await save([{ id: u.id, perms: null }]);

    $('pmCancel').onclick = () => { draft = new Map([...orig].map(([id, set]) => [id, new Set(set)])); draw(); msg(''); };
    $('pmApply').onclick = () => save(changedIds().map(id => ({ id, perms: [...draft.get(id)] })));
    async function save(list) {
      if (!list.length) return;
      $('pmApply').disabled = true;
      try {
        const r = await api('PUT', '/api/permissions', { users: list });
        load(r.users);
        msg(t('r.saved'), 'ok');
        // My own rights changed: reload so the menu and buttons follow them
        if (list.some(x => x.id === currentUser.id)) setTimeout(() => location.reload(), 900);
      } catch (err) { msg(err.message); } finally { $('pmApply').disabled = false; }
    }
    $('pmSearch').addEventListener('input', draw);
    langHook = draw;
    api('GET', '/api/permissions').then(r => load(r.users)).catch(err => msg(err.message));
  }

            <th class="c">${bi('អ្នកត្រួតពិនិត្យ', 'Inspector')}</th>
          </tr>
          <tr>
            <td><select class="res" id="oqcTotal" aria-label="Total determination"><option value=""></option><option>OK</option><option>NG</option></select></td>
            <td><input id="oqcChecked" class="badge-in" aria-label="Checked by" ${P('ph.badge')}></td>
            <td><input id="oqcInspector" class="badge-in" aria-label="Inspector" ${P('ph.badge')} value="${esc(String((currentUser && currentUser.username) || ''))}"></td>
